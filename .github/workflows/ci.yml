name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # MSBuild uses /m for parallelism
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} -- /m

      # Make/Ninja use -j
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} -- -j 2

      - name: Run tests (ctest)
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      # ---- Python smoke test: C++ -> SQLite -> plot PNG ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib
          python -m pip install pytest

      - name: Run Python tests (pytest)
        env:
          MPLBACKEND: Agg
        run:  pytest -q


      # THREE runs so the plot has multiple x-points.
      - name: Smoke runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build\src\${{ matrix.build_type }}\casino.exe"
          if (!(Test-Path $exe)) { $exe = "build\src\Release\casino.exe" }
          if (!(Test-Path $exe)) { throw "Could not find casino.exe" }

          & $exe --db data\ci_demo.db --seed 123 --trials  500   --sides 6 --bet-on 6 --payout 5 --wager 1
          & $exe --db data\ci_demo.db --seed 123 --trials  5000  --sides 6 --bet-on 6 --payout 5 --wager 1
          & $exe --db data\ci_demo.db --seed 123 --trials 50000  --sides 6 --bet-on 6 --payout 5 --wager 1

      - name: Smoke runs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXE="build/src/casino"
          [[ -x "$EXE" ]] || EXE="build/src/${{ matrix.build_type }}/casino"
          [[ -x "$EXE" ]] || { echo "Could not find casino executable"; exit 1; }

          "$EXE" --db data/ci_demo.db --seed 123 --trials  500   --sides 6 --bet-on 6 --payout 5 --wager 1
          "$EXE" --db data/ci_demo.db --seed 123 --trials  5000  --sides 6 --bet-on 6 --payout 5 --wager 1
          "$EXE" --db data/ci_demo.db --seed 123 --trials 50000  --sides 6 --bet-on 6 --payout 5 --wager 1

      # Plot step split per-OS to avoid line-continuation issues
      - name: Plot EV (headless, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MPLBACKEND = 'Agg'
          python scripts\plot_runs.py data\ci_demo.db --metric ev --with-ci --sides 6 --payout 5 --seed 123 --save artifacts\ci_ev.png

      - name: Plot EV (headless, Unix)
        if: runner.os != 'Windows'
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/plot_runs.py data/ci_demo.db --metric ev --with-ci --sides 6 --payout 5 --seed 123 --save artifacts/ci_ev.png

      - name: Upload artifact (plot)
        uses: actions/upload-artifact@v4
        with:
          name: ci-plots-${{ matrix.os }}
          path: artifacts/ci_ev.png
